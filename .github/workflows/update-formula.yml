name: Update formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 0.3.0)
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve sdist URL and checksum from GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="yanka-${VERSION}.tar.gz"
          tag="v${VERSION}"
          url="https://github.com/Nambu14/yanka/releases/download/${tag}/${asset}"

          if ! gh release view "$tag" --repo Nambu14/yanka --json assets \
            --jq ".assets[] | select(.name == \"${asset}\") | .name" | grep -qx "$asset"; then
            echo "Missing release asset ${asset} on Nambu14/yanka ${tag}"
            exit 1
          fi

          curl -fsSL "$url" -o "/tmp/${asset}"
          checksum=$(sha256sum "/tmp/${asset}" | awk '{print $1}')

          echo "SDIST_URL=${url}" >> "$GITHUB_ENV"
          echo "SDIST_SHA256=${checksum}" >> "$GITHUB_ENV"
          echo "Resolved ${url}"
          echo "sha256 ${checksum}"

      - name: Update formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          formula="Formula/yanka.rb"
          sed -i "s|url \".*\"|url \"${SDIST_URL}\"|" "$formula"
          sed -i "s|sha256 \".*\"|sha256 \"${SDIST_SHA256}\"|" "$formula"

      - name: Open pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/yanka.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date."
            exit 0
          fi

          branch="update-yanka-${VERSION}"
          git fetch origin "$branch" 2>/dev/null || true
          git checkout -B "$branch"
          git commit -m "yanka ${VERSION}"
          git push origin "HEAD:${branch}" --force

          existing_url=$(gh pr list --head "$branch" --base main --json url --jq '.[0].url // empty')
          if [ -n "$existing_url" ]; then
            echo "Pull request already open: ${existing_url}"
            exit 0
          fi

          pr_url="https://github.com/${{ github.repository }}/compare/main...${branch}?expand=1"
          body=$(cat <<EOF
          Update formula to yanka ${VERSION}.

          - url: \`${SDIST_URL}\`
          - sha256: \`${SDIST_SHA256}\`
          EOF
          )
          if gh pr create \
            --title "yanka ${VERSION}" \
            --body "$body" \
            --base main \
            --head "$branch"; then
            exit 0
          fi

          echo "::warning::Could not open a pull request automatically."
          echo "Enable: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests"
          echo "Then open manually: ${pr_url}"
          exit 1
